[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security-cli"
version = "0.3.0"
description = "Shared SENTINEL workspaces and server-backed Solidity reviews"
requires-python = ">=3.11"
dependencies = ["sibyl-memory-client==0.8.0", "keyring>=25,<27"]

[project.scripts]
sentinel = "bugmind.cli:main"
bugmind = "bugmind.cli:main"

[tool.setuptools.packages.find]
include = ["bugmind*", "worker*"]

[tool.setuptools.package-data]
bugmind = ["pashov_data/LICENSE", "pashov_data/manifest.json", "pashov_data/solidity-auditor/*", "pashov_data/solidity-auditor/references/*.md", "pashov_data/solidity-auditor/references/hacking-agents/*.md"]
